<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bitácora</title>

<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#1F2229" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Bitácora" />

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  body { background:#1F2229; font-family:'Inter',sans-serif; }
  .font-display { font-family:'Space Grotesk',sans-serif; }
  .font-mono { font-family:'JetBrains Mono',monospace; }
</style>
</head>
<body class="text-[#F5F5F5] px-5 py-8 min-h-screen pb-24">

<div class="max-w-sm mx-auto">
  <p class="text-[10px] tracking-[0.2em] text-[#B8BCC4] font-mono uppercase mb-1">Bitácora</p>
  <h1 id="dateHeader" class="font-display font-semibold text-xl mb-5"></h1>

  <div class="flex gap-2 mb-5">
    <button id="tabHoyBtn" class="flex-1 py-2 rounded-lg text-sm font-medium border transition-colors">Hoy</button>
    <button id="tabEjBtn" class="flex-1 py-2 rounded-lg text-sm font-medium border transition-colors">Ejercicio</button>
  </div>

  <div id="panelHoy">
    <section class="bg-[#2A2E37] border border-white/[0.12] rounded-xl p-5 mb-4">
      <span class="text-sm font-medium">Hábitos</span>
      <div id="habitsList" class="space-y-3 mt-4"></div>
    </section>

    <section class="bg-[#2A2E37] border border-white/[0.12] rounded-xl p-5">
      <div class="flex items-center justify-between mb-1">
        <span class="text-sm font-medium">Metas de la semana</span>
        <span id="goalsCount" class="font-mono text-xs text-[#B8BCC4]"></span>
      </div>
      <p id="weekRangeNote" class="font-mono text-[10px] text-[#8A8F99] mb-4"></p>
      <div id="goalsList" class="space-y-2 mb-3"></div>
      <div class="flex gap-2">
        <input id="newGoalInput" placeholder="ej: escribir carta a mi mama"
          class="flex-1 bg-white/[0.05] border border-white/[0.16] rounded-lg px-3 py-2 text-sm placeholder:text-[#8A8F99] outline-none focus:border-[#4FA8A0]/50" />
        <button id="addGoalBtn" class="w-9 h-9 rounded-lg bg-[#4FA8A0]/[0.15] border border-[#4FA8A0]/40 flex items-center justify-center shrink-0 text-[#4FA8A0] font-bold">+</button>
      </div>
    </section>
  </div>

  <div id="panelEj" class="hidden">
    <section class="bg-[#2A2E37] border border-white/[0.12] rounded-xl p-5 mb-4">
      <div class="flex items-center justify-between mb-1">
        <span id="dayBadge" class="text-[10px] font-mono uppercase tracking-wide px-2 py-0.5 rounded"></span>
        <span id="weekProgress" class="font-mono text-[10px] text-[#8A8F99]"></span>
      </div>
      <h2 id="dayLabel" class="font-display font-semibold text-lg mt-2 mb-1"></h2>
      <p class="text-[10px] text-[#8A8F99] mb-4">Podés editar nombre, series/reps, o agregar/quitar ejercicios de hoy.</p>

      <div id="fixedExercises" class="space-y-2"></div>
      <button id="addExerciseBtn" class="hidden w-full mt-2 py-2.5 rounded-lg border border-dashed border-white/20 text-xs text-[#8A8F99] hover:text-[#B8BCC4] hover:border-white/30 transition-colors">
        + Agregar ejercicio
      </button>

      <div id="flexibleBlock" class="hidden">
        <button id="flexToggleBtn" class="w-full flex items-center justify-center gap-2 rounded-lg py-4 border transition-colors mb-3">
          <span id="flexCheck" class="w-5 h-5 rounded-md flex items-center justify-center border"></span>
          <span id="flexLabel" class="text-sm font-medium"></span>
        </button>
        <input id="flexNote" placeholder="ej: piscina 30 min"
          class="w-full bg-white/[0.05] border border-white/[0.16] rounded-lg px-3 py-2 text-sm placeholder:text-[#8A8F99] outline-none focus:border-[#4FA8A0]/50" />
      </div>
    </section>

    <section class="bg-[#2A2E37] border border-white/[0.12] rounded-xl p-5 mb-4">
      <span class="text-sm font-medium">Resumen del mes</span>
      <div id="monthSummary" class="mt-3 space-y-2"></div>
    </section>

    <section class="bg-[#2A2E37] border border-white/[0.12] rounded-xl p-5">
      <span class="text-sm font-medium">Progreso de pesos</span>
      <p class="font-mono text-[10px] text-[#8A8F99] mt-1 mb-3">historico completo, primer -> ultimo registro</p>
      <div id="progressList" class="space-y-2"></div>
    </section>
  </div>
</div>

<script>
const STORAGE_KEY = "bitacora-data";
const pad = (n) => String(n).padStart(2, "0");
const fmtDate = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const monthKey = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const todayKey = () => fmtDate(new Date());
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

const ROUTINE = {
  1: { label: "Push - Pecho, Hombro, Triceps", type: "fixed", core: true, exercises: [
    { name: "Press banca", target: "4x8" },
    { name: "Press militar", target: "3x10" },
    { name: "Press inclinado mancuernas", target: "3x10" },
    { name: "Elevaciones laterales", target: "3x15" },
    { name: "Fondos en paralelas", target: "3x12" },
  ]},
  2: { label: "Pull - Espalda, Biceps", type: "fixed", core: true, exercises: [
    { name: "Dominadas", target: "4x8" },
    { name: "Remo con barra", target: "3x10" },
    { name: "Jalon al pecho", target: "3x12" },
    { name: "Curl biceps barra Z", target: "3x12" },
    { name: "Face pull", target: "3x15" },
  ]},
  3: { label: "Piernas - Cuads, Isquios, Gluteos", type: "fixed", core: true, exercises: [
    { name: "Sentadilla", target: "4x8" },
    { name: "Peso muerto rumano", target: "3x10" },
    { name: "Prensa", target: "3x12" },
    { name: "Curl femoral", target: "3x12" },
    { name: "Elevacion de talones", target: "3x15" },
  ]},
  4: { label: "Piscina o Bailoterapia", type: "flexible" },
  5: { label: "Brazos - Biceps, Triceps, Hombro", type: "fixed", core: false, exercises: [
    { name: "Curl de barra", target: "4x10" },
    { name: "Curl martillo", target: "3x12" },
    { name: "Extension triceps polea", target: "3x12" },
    { name: "Fondos en banco", target: "3x15" },
    { name: "Elevaciones laterales", target: "3x15" },
    { name: "Elevaciones frontales", target: "3x12" },
  ]},
  6: { label: "Rugby o Gym", type: "flexible" },
  0: { label: "Futbol", type: "flexible" },
};

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}
function save(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

let state = Object.assign({
  habits: null,
  habitLogs: {},
  journalLog: null,
  goals: [],
  goalsHistory: {},
  currentGoalsWeekKey: null,
  exerciseLog: {},
}, load());

if (!state.habits) {
  state.habits = [
    { id: "escritura", name: "Escritura diaria" },
    { id: "agradecer", name: "Agradecer antes de dormir" },
  ];
}
if (state.journalLog && !state.habitLogs["escritura"]) {
  state.habitLogs["escritura"] = state.journalLog;
}
delete state.journalLog;
state.habits.forEach(h => { if (!state.habitLogs[h.id]) state.habitLogs[h.id] = {}; });

// migracion de estructura vieja de ejercicio (entries: {nombre: {done,weight}}) -> exercises: [{id,name,target,done,weight,reps}]
Object.keys(state.exerciseLog).forEach(dateKey => {
  const entry = state.exerciseLog[dateKey];
  if (entry.entries && !entry.exercises && !entry.activity) {
    const hasActividad = "actividad" in entry.entries;
    if (hasActividad) {
      entry.activity = { done: entry.entries.actividad.done, note: entry.entries.actividad.note || "" };
      entry.exercises = [];
    } else {
      entry.exercises = Object.entries(entry.entries).map(([name, v]) => ({
        id: uid(), name, target: "", done: v.done, weight: v.weight || "", reps: ""
      }));
      entry.activity = null;
    }
    delete entry.entries;
  }
  if (!entry.exercises) entry.exercises = [];
  if (entry.activity === undefined) entry.activity = null;
});
save(state);

function mondayOf(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return fmtDate(d);
}
function ensureWeekReset() {
  const wk = mondayOf(new Date());
  if (state.currentGoalsWeekKey !== wk) {
    if (state.currentGoalsWeekKey && state.goals.length > 0) {
      state.goalsHistory[state.currentGoalsWeekKey] = state.goals;
    }
    state.goals = [];
    state.currentGoalsWeekKey = wk;
    save(state);
  }
}
ensureWeekReset();

function calcStreak(log) {
  let streak = 0;
  let d = new Date();
  if (!log[todayKey()]) d.setDate(d.getDate() - 1);
  while (true) {
    const key = fmtDate(d);
    if (log[key]) { streak++; d.setDate(d.getDate() - 1); } else break;
  }
  return streak;
}
function calcBestStreak(log) {
  const dates = Object.keys(log).filter(k => log[k]).sort();
  let best = 0, run = 0, prev = null;
  for (const ds of dates) {
    if (prev) {
      const diffDays = (new Date(ds) - new Date(prev)) / 86400000;
      run = diffDays === 1 ? run + 1 : 1;
    } else run = 1;
    best = Math.max(best, run);
    prev = ds;
  }
  return best;
}

function paintTabs(active) {
  const hoy = document.getElementById("tabHoyBtn");
  const ej = document.getElementById("tabEjBtn");
  const on = "flex-1 py-2 rounded-lg text-sm font-medium border transition-colors bg-[#E8A33D]/[0.12] border-[#E8A33D]/50 text-[#E8A33D]";
  const off = "flex-1 py-2 rounded-lg text-sm font-medium border transition-colors bg-white/[0.05] border-white/[0.16] text-[#B8BCC4]";
  hoy.className = active === "hoy" ? on : off;
  ej.className = active === "ej" ? on : off;
  document.getElementById("panelHoy").classList.toggle("hidden", active !== "hoy");
  document.getElementById("panelEj").classList.toggle("hidden", active !== "ej");
}
document.getElementById("tabHoyBtn").onclick = () => { paintTabs("hoy"); };
document.getElementById("tabEjBtn").onclick = () => { paintTabs("ej"); renderEjercicio(); };

// ===================== HABITOS =====================
function renderHabits() {
  const el = document.getElementById("habitsList");
  el.innerHTML = "";
  state.habits.forEach(h => {
    const log = state.habitLogs[h.id] || (state.habitLogs[h.id] = {});
    const doneToday = !!log[todayKey()];
    const streak = calcStreak(log);
    const best = calcBestStreak(log);
    const note = streak === 0 && best > 0 ? `racha reiniciada - mejor: ${best}` : (best > streak ? `mejor: ${best}` : "");

    const card = document.createElement("div");
    card.className = "bg-white/[0.03] border border-white/[0.08] rounded-lg p-3";

    const top = document.createElement("div");
    top.className = "flex items-center justify-between mb-2.5";
    top.innerHTML = `<span class="text-sm font-medium">${h.name}</span><span class="font-mono text-xs text-[#E8A33D]">${streak}</span>`;

    const btn = document.createElement("button");
    const paint = () => {
      if (doneToday) {
        btn.className = "w-full flex items-center justify-center gap-2 rounded-lg py-3 border transition-colors bg-[#E8A33D]/[0.12] border-[#E8A33D]/50 text-[#E8A33D]";
        btn.innerHTML = `<span class="w-4 h-4 rounded flex items-center justify-center border bg-[#E8A33D] border-[#E8A33D] text-[#1F2229] text-[9px] font-bold">OK</span><span class="text-sm font-medium">Hecho hoy</span>`;
      } else {
        btn.className = "w-full flex items-center justify-center gap-2 rounded-lg py-3 border transition-colors bg-white/[0.05] border-white/[0.16] text-[#B8BCC4]";
        btn.innerHTML = `<span class="w-4 h-4 rounded flex items-center justify-center border border-white/30"></span><span class="text-sm font-medium">Marcar como hecho</span>`;
      }
    };
    paint();
    btn.onclick = () => { const key = todayKey(); log[key] = !log[key]; save(state); renderHabits(); };

    const strip = document.createElement("div");
    strip.className = "flex gap-[3px] mt-2.5";
    for (let i = 13; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const v = !!log[fmtDate(d)];
      const span = document.createElement("span");
      span.className = `flex-1 h-2 rounded-sm ${v ? "bg-[#E8A33D]" : "bg-white/[0.1]"}`;
      strip.appendChild(span);
    }
    const noteEl = document.createElement("p");
    noteEl.className = "font-mono text-[10px] text-[#8A8F99] mt-1";
    noteEl.textContent = note;

    card.appendChild(top); card.appendChild(btn); card.appendChild(strip);
    if (note) card.appendChild(noteEl);
    el.appendChild(card);
  });
}

// ===================== GOALS =====================
function renderGoals() {
  document.getElementById("dateHeader").textContent =
    new Date().toLocaleDateString("es-EC", { weekday: "long", day: "numeric", month: "long" });

  const wkStart = new Date(state.currentGoalsWeekKey);
  const wkEnd = new Date(wkStart); wkEnd.setDate(wkEnd.getDate() + 6);
  const opts = { day: "numeric", month: "short" };
  document.getElementById("weekRangeNote").textContent =
    `semana del ${wkStart.toLocaleDateString("es-EC", opts)} al ${wkEnd.toLocaleDateString("es-EC", opts)}`;

  const doneGoals = state.goals.filter(g => g.done).length;
  document.getElementById("goalsCount").textContent = `${doneGoals}/${state.goals.length}`;

  const list = document.getElementById("goalsList");
  list.innerHTML = "";
  if (state.goals.length === 0) {
    const p = document.createElement("p");
    p.className = "text-xs text-[#8A8F99] py-2";
    p.textContent = "Sin metas todavia. Agrega la primera abajo.";
    list.appendChild(p);
  }
  state.goals.forEach(g => {
    const row = document.createElement("div");
    row.className = "flex items-center gap-3 bg-white/[0.05] border border-white/[0.12] rounded-lg px-3 py-2.5";
    const box = document.createElement("button");
    box.className = `w-5 h-5 rounded-md flex items-center justify-center shrink-0 border text-[10px] font-bold ${g.done ? "bg-[#4FA8A0] border-[#4FA8A0] text-[#1F2229]" : "border-white/30 text-transparent"}`;
    box.textContent = "OK";
    box.onclick = () => { g.done = !g.done; save(state); renderGoals(); };
    const span = document.createElement("span");
    span.className = `flex-1 text-sm ${g.done ? "line-through text-[#8A8F99]" : "text-[#F5F5F5]"}`;
    span.textContent = g.text;
    const del = document.createElement("button");
    del.className = "text-[#8A8F99] hover:text-[#F5F5F5] transition-colors";
    del.textContent = "x";
    del.onclick = () => { state.goals = state.goals.filter(x => x.id !== g.id); save(state); renderGoals(); };
    row.appendChild(box); row.appendChild(span); row.appendChild(del);
    list.appendChild(row);
  });
}
document.getElementById("addGoalBtn").onclick = addGoal;
document.getElementById("newGoalInput").addEventListener("keydown", (e) => { if (e.key === "Enter") addGoal(); });
function addGoal() {
  const input = document.getElementById("newGoalInput");
  const text = input.value.trim();
  if (!text) return;
  state.goals.push({ id: Date.now(), text, done: false });
  input.value = ""; save(state); renderGoals();
}

// ===================== EJERCICIO =====================
function getDayEntry(dateKey) {
  if (!state.exerciseLog[dateKey]) {
    const dow = new Date(dateKey + "T00:00:00").getDay();
    const routine = ROUTINE[dow];
    state.exerciseLog[dateKey] = {
      exercises: routine.type === "fixed"
        ? routine.exercises.map(ex => ({ id: uid(), name: ex.name, target: ex.target, done: false, weight: "", reps: "" }))
        : [],
      activity: routine.type === "flexible" ? { done: false, note: "" } : null,
    };
    save(state);
  }
  return state.exerciseLog[dateKey];
}

function renderEjercicio() {
  const now = new Date();
  const dow = now.getDay();
  const routine = ROUTINE[dow];
  const dk = todayKey();
  const dayEntry = getDayEntry(dk);

  document.getElementById("dayBadge").textContent = routine.type === "fixed" ? (routine.core ? "Dia fijo" : "Dia de gym") : "Dia flexible";
  document.getElementById("dayBadge").className = `text-[10px] font-mono uppercase tracking-wide px-2 py-0.5 rounded ${routine.core ? "bg-[#E8A33D]/20 text-[#E8A33D]" : "bg-white/10 text-[#B8BCC4]"}`;
  document.getElementById("dayLabel").textContent = routine.label;

  const wkStart = new Date(mondayOf(now));
  let fixedDone = 0, activeDays = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(wkStart); d.setDate(d.getDate() + i);
    const key = fmtDate(d);
    const entry = state.exerciseLog[key];
    const r = ROUTINE[d.getDay()];
    const isDone = entry && ((entry.exercises && entry.exercises.some(e => e.done)) || (entry.activity && entry.activity.done));
    if (isDone) { activeDays++; if (r.core) fixedDone++; }
  }
  document.getElementById("weekProgress").textContent = `3 fijos: ${fixedDone}/3 - semana: ${activeDays}/7`;

  const fixedEl = document.getElementById("fixedExercises");
  const addBtn = document.getElementById("addExerciseBtn");
  const flexEl = document.getElementById("flexibleBlock");

  if (routine.type === "fixed") {
    flexEl.classList.add("hidden");
    fixedEl.classList.remove("hidden");
    addBtn.classList.remove("hidden");
    fixedEl.innerHTML = "";
    dayEntry.exercises.forEach(ex => {
      const row = document.createElement("div");
      row.className = "bg-white/[0.05] border border-white/[0.12] rounded-lg px-3 py-2.5";

      const line1 = document.createElement("div");
      line1.className = "flex items-center gap-2 mb-2";

      const box = document.createElement("button");
      box.className = `w-5 h-5 rounded-md flex items-center justify-center shrink-0 border text-[10px] font-bold ${ex.done ? "bg-[#4FA8A0] border-[#4FA8A0] text-[#1F2229]" : "border-white/30 text-transparent"}`;
      box.textContent = "OK";
      box.onclick = () => { ex.done = !ex.done; save(state); renderEjercicio(); };

      const nameInput = document.createElement("input");
      nameInput.value = ex.name;
      nameInput.className = "flex-1 min-w-0 bg-transparent text-sm font-medium outline-none border-b border-transparent focus:border-white/20";
      nameInput.oninput = (e) => { ex.name = e.target.value; save(state); };

      const del = document.createElement("button");
      del.className = "text-[#8A8F99] hover:text-[#F5F5F5] text-xs shrink-0";
      del.textContent = "x";
      del.onclick = () => {
        dayEntry.exercises = dayEntry.exercises.filter(e2 => e2.id !== ex.id);
        save(state); renderEjercicio();
      };

      line1.appendChild(box); line1.appendChild(nameInput); line1.appendChild(del);

      const line2 = document.createElement("div");
      line2.className = "flex items-center gap-2 pl-7";

      const targetInput = document.createElement("input");
      targetInput.value = ex.target || "";
      targetInput.placeholder = "series x reps";
      targetInput.className = "w-20 bg-white/[0.05] border border-white/[0.12] rounded-md px-2 py-1 text-[11px] font-mono outline-none focus:border-[#4FA8A0]/50";
      targetInput.oninput = (e) => { ex.target = e.target.value; save(state); };

      const repsInput = document.createElement("input");
      repsInput.value = ex.reps || "";
      repsInput.placeholder = "reps reales";
      repsInput.className = "flex-1 min-w-0 bg-white/[0.05] border border-white/[0.12] rounded-md px-2 py-1 text-[11px] font-mono outline-none focus:border-[#4FA8A0]/50";
      repsInput.oninput = (e) => { ex.reps = e.target.value; save(state); };

      const weightInput = document.createElement("input");
      weightInput.type = "number";
      weightInput.placeholder = "kg";
      weightInput.value = ex.weight || "";
      weightInput.className = "w-14 bg-white/[0.05] border border-white/[0.12] rounded-md px-2 py-1 text-[11px] font-mono text-center outline-none focus:border-[#4FA8A0]/50";
      weightInput.oninput = (e) => { ex.weight = e.target.value; save(state); };
      weightInput.onblur = () => { renderProgress(); renderMonthSummary(); };

      line2.appendChild(targetInput); line2.appendChild(repsInput); line2.appendChild(weightInput);

      row.appendChild(line1); row.appendChild(line2);
      fixedEl.appendChild(row);
    });

    addBtn.onclick = () => {
      dayEntry.exercises.push({ id: uid(), name: "Nuevo ejercicio", target: "", done: false, weight: "", reps: "" });
      save(state); renderEjercicio();
    };
  } else {
    fixedEl.classList.add("hidden");
    addBtn.classList.add("hidden");
    flexEl.classList.remove("hidden");
    const activity = dayEntry.activity || (dayEntry.activity = { done: false, note: "" });
    const btn = document.getElementById("flexToggleBtn");
    const check = document.getElementById("flexCheck");
    const label = document.getElementById("flexLabel");
    const noteInput = document.getElementById("flexNote");
    noteInput.value = activity.note || "";

    function paintFlex() {
      if (activity.done) {
        btn.className = "w-full flex items-center justify-center gap-2 rounded-lg py-4 border transition-colors mb-3 bg-[#4FA8A0]/[0.12] border-[#4FA8A0]/50 text-[#4FA8A0]";
        check.className = "w-5 h-5 rounded-md flex items-center justify-center border bg-[#4FA8A0] border-[#4FA8A0] text-[#1F2229] text-xs font-bold";
        check.textContent = "OK"; label.textContent = "Hecho hoy";
      } else {
        btn.className = "w-full flex items-center justify-center gap-2 rounded-lg py-4 border transition-colors mb-3 bg-white/[0.05] border-white/[0.16] text-[#B8BCC4]";
        check.className = "w-5 h-5 rounded-md flex items-center justify-center border border-white/30";
        check.textContent = ""; label.textContent = "Marcar como hecho";
      }
    }
    paintFlex();
    btn.onclick = () => { activity.done = !activity.done; save(state); paintFlex(); };
    noteInput.oninput = (e) => { activity.note = e.target.value; save(state); };
  }

  renderProgress();
  renderMonthSummary();
}

function renderProgress() {
  const series = {};
  Object.keys(state.exerciseLog).sort().forEach(dateKey => {
    const entry = state.exerciseLog[dateKey];
    (entry.exercises || []).forEach(ex => {
      if (ex.weight && !isNaN(parseFloat(ex.weight))) {
        if (!series[ex.name]) series[ex.name] = [];
        series[ex.name].push({ date: dateKey, weight: parseFloat(ex.weight) });
      }
    });
  });

  const el = document.getElementById("progressList");
  el.innerHTML = "";
  const names = Object.keys(series);
  if (names.length === 0) {
    const p = document.createElement("p");
    p.className = "text-xs text-[#8A8F99]";
    p.textContent = "Todavia no hay pesos registrados.";
    el.appendChild(p);
    return;
  }
  names.forEach(name => {
    const s = series[name];
    const first = s[0].weight, last = s[s.length - 1].weight, delta = last - first;
    const row = document.createElement("div");
    row.className = "flex items-center justify-between bg-white/[0.05] border border-white/[0.12] rounded-lg px-3 py-2.5";
    row.innerHTML = `<span class="text-sm">${name}</span>
      <span class="font-mono text-xs ${delta > 0 ? "text-[#4FA8A0]" : delta < 0 ? "text-[#E8A33D]" : "text-[#8A8F99]"}">
        ${first}kg -> ${last}kg ${delta !== 0 ? (delta > 0 ? "+" : "-") + Math.abs(delta) : ""}
      </span>`;
    el.appendChild(row);
  });
}

function renderMonthSummary() {
  const now = new Date();
  const mk = monthKey(now);
  const daysInMonthSoFar = now.getDate();

  let trainedDays = 0, fixedTarget = 0, fixedDone = 0, exerciseCount = {};
  for (let day = 1; day <= daysInMonthSoFar; day++) {
    const d = new Date(now.getFullYear(), now.getMonth(), day);
    const key = fmtDate(d);
    const r = ROUTINE[d.getDay()];
    const entry = state.exerciseLog[key];
    const isDone = entry && ((entry.exercises && entry.exercises.some(e => e.done)) || (entry.activity && entry.activity.done));
    if (r.core) {
      fixedTarget++;
      if (isDone) fixedDone++;
    }
    if (isDone) {
      trainedDays++;
      (entry.exercises || []).forEach(ex => { if (ex.done) exerciseCount[ex.name] = (exerciseCount[ex.name] || 0) + 1; });
    }
  }

  const el = document.getElementById("monthSummary");
  el.innerHTML = "";
  const stat = document.createElement("div");
  stat.className = "flex gap-2";
  stat.innerHTML = `
    <div class="flex-1 bg-white/[0.05] border border-white/[0.12] rounded-lg px-3 py-2.5 text-center">
      <p class="font-mono text-lg text-[#E8A33D]">${trainedDays}/${daysInMonthSoFar}</p>
      <p class="text-[10px] text-[#8A8F99] mt-0.5">dias activos</p>
    </div>
    <div class="flex-1 bg-white/[0.05] border border-white/[0.12] rounded-lg px-3 py-2.5 text-center">
      <p class="font-mono text-lg text-[#4FA8A0]">${fixedDone}/${fixedTarget}</p>
      <p class="text-[10px] text-[#8A8F99] mt-0.5">3 fijos cumplidos</p>
    </div>`;
  el.appendChild(stat);

  const names = Object.keys(exerciseCount);
  if (names.length > 0) {
    const p = document.createElement("p");
    p.className = "text-[10px] text-[#8A8F99] mt-1";
    p.textContent = "veces por ejercicio este mes:";
    el.appendChild(p);
    const list = document.createElement("div");
    list.className = "flex flex-wrap gap-1.5 mt-1";
    names.forEach(n => {
      const tag = document.createElement("span");
      tag.className = "text-[10px] font-mono bg-white/[0.06] rounded px-2 py-1 text-[#B8BCC4]";
      tag.textContent = `${n} x${exerciseCount[n]}`;
      list.appendChild(tag);
    });
    el.appendChild(list);
  }
}

renderHabits();
renderGoals();
paintTabs("hoy");
</script>
</body>

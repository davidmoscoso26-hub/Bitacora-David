<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bitácora</title>
<meta name="description" content="Presupuesto personal por sobres: gastos, fondos, ritmo y resumen del mes." />

<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0D0F15" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Bitácora" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:opsz,wght@9..40,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css" />

<script>
  // aplica el tema antes de pintar para evitar el parpadeo
  try {
    var t = (JSON.parse(localStorage.getItem("bitacora-data")) || {}).settings;
    t = (t && t.theme) || "auto";
    var dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  } catch (e) {}
</script>
</head>
<body>
  <main id="screen" aria-live="polite"></main>
  <nav id="tabbar" class="tabbar" aria-label="Navegación principal"></nav>
  <div id="sheetRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>

  <script src="/core.js"></script>
  <script src="/finance.js"></script>
  <script src="/inbox.js"></script>
  <script src="/cierre.js"></script>
  <script src="/sync.js"></script>
  <script src="/views.js"></script>
  <script src="/life.js"></script>
  <script src="/app.js"></script>
</body>
</html>
